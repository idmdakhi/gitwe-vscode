<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitwe WebGUI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🌿 Gitwe Workflow Dashboard</h1>
      <div class="header-info">
        <span id="currentBranch">Loading...</span>
        <button onclick="refreshAll()">🔄 Refresh</button>
      </div>
    </header>

    <main>
      <section id="overview">
        <div class="card">
          <h3>Branches</h3>
          <p id="totalBranches">-</p>
        </div>
        <div class="card">
          <h3>Workflow</h3>
          <p id="workflowName">-</p>
        </div>
        <div class="card">
          <h3>Status</h3>
          <p id="healthStatus">-</p>
        </div>
      </section>

      <section id="main-content">
        <div id="tree-container">
          <h3>Branch Tree</h3>
          <div id="tree"></div>
        </div>
        <div id="actions">
          <h3>Actions</h3>
          <div class="action-group">
            <input type="text" id="branchType" placeholder="type (feature)" />
            <input
              type="text"
              id="shortName"
              placeholder="short name (login)"
            />
            <button onclick="startBranch()">Start</button>
          </div>
          <div class="action-group">
            <input type="text" id="finishBranch" placeholder="branch name" />
            <button onclick="finishBranch()">Finish</button>
          </div>
          <div class="action-group">
            <input type="text" id="checkoutBranch" placeholder="branch name" />
            <button onclick="checkoutBranch()">Checkout</button>
          </div>
          <div class="action-group">
            <button onclick="showDoctor()">Run Doctor</button>
            <button onclick="showConfig()">Show Config</button>
          </div>
        </div>
      </section>

      <section id="commits-section">
        <h3>Recent Commits</h3>
        <select id="commitBranchSelect"></select>
        <button onclick="loadCommits()">Load</button>
        <ul id="commitList"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
