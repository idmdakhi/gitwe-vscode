name: Publish VS Code Extension
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension
on:
  push:
    tags:
      - "v*" # مثلاً v0.1.0
  workflow_dispatch: # اجرای دستی

permissions:
  contents: write # برای آپلود vsix به Release (اختیاری)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # نسخه را از تگ بگیر (اختیاری)
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm pkg set version="$VERSION"

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        # اگر dependencyهای npm داخل اکستنشن لازم است، --no-dependencies را بردارید

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: "*.vsix"
          retention-days: 14

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # معادل:
        # npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}

      # اختیاری: همان vsix روی GitHub Release
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
